[package]
name = "mapanimator-web"
version = "0.7.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
mapanimator-core = { path = "../timeline-core" }
effectcraft-keyframe.workspace = true
effectcraft-time.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }
console_error_panic_hook = "0.1"
