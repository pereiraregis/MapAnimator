[workspace]
resolver = "3"
members = ["timeline-core", "timeline-web", "vendor/effectcraft/time", "vendor/effectcraft/geom", "vendor/effectcraft/color", "vendor/effectcraft/keyframe"]
[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
[workspace.dependencies]
effectcraft-time = { path = "vendor/effectcraft/time" }
effectcraft-geom = { path = "vendor/effectcraft/geom" }
effectcraft-color = { path = "vendor/effectcraft/color" }
effectcraft-keyframe = { path = "vendor/effectcraft/keyframe" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1"
[workspace.lints.rust]
unsafe_code = "forbid"
[profile.release]
opt-level = "s"
lto = "thin"
